[project]
name = "iml"
version = "0.1.0"
description = "IML 2026/27: voice intercom speaker verification on spectrograms with CNNs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14.1,<2.15",
    "torchaudio>=2.11,<2.12",
    "torchvision>=0.29.1,<0.30",
    "soundfile>=0.12",
    "triton-rocm>=3.8,<3.9 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "mlflow>=2.16",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "tabulate>=0.9",
]

[project.scripts]
iml-train = "iml.cli.train:main"
iml-sweep = "iml.cli.sweep:main"
iml-compare = "iml.cli.compare:main"
iml-export = "iml.cli.export:main"
iml-data = "iml.cli.data:main"

[dependency-groups]
data = [
    "av>=14",  # decodes raw audio (.oga/.m4a/...) in iml-data build
    "imageio-ffmpeg>=0.5",  # an ffmpeg binary inside the venv (bin/ffmpeg)
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "nbstripout>=0.7",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iml"]

# --- PyTorch: HIP/ROCm wheels (AMD GPU) on the Linux training server, PyPI (CPU/MPS) on macOS ---
# The wheels bundle the ROCm runtime; the index must have kernels for the server's GPU: the
# Radeon 8060S (Strix Halo, gfx1151) needs rocm7.2 (rocm6.4 has none, rocm7.1 segfaults on it).
# triton-rocm is listed as a direct dependency only so that the source below applies to it.
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs a few seconds (mlflow sqlite migrations)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]  # notebooks put sys.path setup before imports on purpose

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
