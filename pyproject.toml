[project]
name = "iml"
version = "0.1.0"
description = "IML 2026/27: voice intercom speaker verification on spectrograms with CNNs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14.1,<2.15",
    "torchaudio>=2.11,<2.12",
    "torchvision>=0.29.1,<0.30",
    "soundfile>=0.12",
    "triton-rocm>=3.8,<3.9 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "mlflow>=2.16",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "tabulate>=0.9",
    "timm>=1.0.15,<1.1",
    "onnx>=1.16",  # fit() exports every run to model.onnx
    "onnxruntime>=1.18",  # ...and verifies it against PyTorch
]

[project.scripts]
iml-train = "iml.cli:train_main"
iml-sweep = "iml.cli:sweep_main"
iml-compare = "iml.cli:compare_main"
iml-export = "iml.cli:export_main"
iml-data = "iml.cli:data_main"

[dependency-groups]
data = [
    "av>=14",  # decodes raw audio (.oga/.m4a/...) in iml-data build
    "imageio-ffmpeg>=0.5",  # an ffmpeg binary inside the venv (bin/ffmpeg)
]
edge = [  # torch-free runtime of notebooks/glhfsox/edge (voicegate)
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "soundfile>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
    "httpx>=0.27",  # fastapi.testclient
]
edge-audio = [  # live mic + resampling for voicegate; needs libportaudio2
    "sounddevice>=0.5",
    "soxr>=0.4",
]
sv = [  # notebooks/glhfsox/sv_metric: triplet-loss speaker embeddings (metric learning + data fetch)
    "pytorch-metric-learning>=2.9,<2.10",
    "huggingface_hub>=0.34",
    "pyarrow>=15",
    "psutil>=5.9",  # mlflow system metrics
    "scipy>=1.11",  # fftconvolve (reverb, near-duplicate confirmation)
]
tg = [  # tg/: whisper-base transcription endpoint + Telegram bot (tg/README.md)
    "faster-whisper>=1.2,<2",  # CTranslate2 whisper: CPU int8 (ctranslate2 has no ROCm backend)
    "aiogram>=3.31,<4",
    "python-multipart>=0.0.20",  # fastapi UploadFile
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "telethon>=1.45,<2",  # tg/userbot.py: your own account (MTProto)
    "qrcode>=8",  # tg/login.py --qr: the login QR in the terminal
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "nbstripout>=0.7",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iml"]

# --- PyTorch: HIP/ROCm wheels (AMD GPU) on the Linux training server, PyPI (CPU/MPS) on macOS ---
# The wheels bundle the ROCm runtime; the index must have kernels for the server's GPU: the
# Radeon 8060S (Strix Halo, gfx1151) needs rocm7.2 (rocm6.4 has none, rocm7.1 segfaults on it).
# triton-rocm is listed as a direct dependency only so that the source below applies to it.
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tg/tests"]
addopts = "-q"
markers = ['slow: perf/wall-clock bounds and multi-second tests (deselect with -m "not slow")']

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]  # notebooks put sys.path setup before imports on purpose
src = [".", "src", "notebooks/glhfsox/edge"]  # first-party: app, iml, voicegate

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
